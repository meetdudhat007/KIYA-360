# KNIT 360 local development stack.
#
# Bare Frappe only: no ERPNext, no HRMS. knit360_core must install on a site where
# Frappe is the only app, and this stack is what proves it.
#
#   docker compose -f infrastructure/docker-compose.dev.yml up -d
#
# Then open http://knit360.localhost:8000 -- NOT http://localhost:8000.
#
# Cookies are scoped by hostname and ignore the port, so a second Frappe site on
# localhost:8080 (an ERPNext instance kept for reference, say) shares one cookie
# jar with this one. Frappe sets `sid` with no Domain attribute, so logging into
# either site overwrites the other's session and the first silently logs out.
# Two hostnames, two cookie jars, both sessions alive at once. *.localhost
# resolves to 127.0.0.1 in browsers with no hosts-file entry needed.
#
# The bench container idles; work happens through `docker compose exec bench`.
# backend/ is bind-mounted, so edits on the host are visible inside instantly.

services:
  db:
    image: mariadb:10.6
    container_name: knit-db
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MARIADB_ROOT_PASSWORD: knitdev
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  redis-cache:
    image: redis:7-alpine
    container_name: knit-redis-cache

  redis-queue:
    image: redis:7-alpine
    container_name: knit-redis-queue

  bench:
    image: frappe/bench:latest
    container_name: knit-bench
    # Serve the default site if a bench exists, and idle otherwise, so the very
    # first `up` (before the bench is built) still gives you a shell to work in.
    # `bench serve` is a foreground process, so without this it dies with the
    # container and has to be restarted by hand every session.
    command: >
      bash -lc '
      if [ -f /home/frappe/frappe-bench/sites/common_site_config.json ]; then
        cd /home/frappe/frappe-bench && exec bench serve --port 8000;
      else
        echo "no bench yet -- idling; build one, then restart this container";
        exec sleep infinity;
      fi'
    working_dir: /home/frappe
    user: frappe
    environment:
      SHELL: /bin/bash
    volumes:
      - bench-home:/home/frappe
      # The KNIT 360 apps, edited on the host.
      - ../backend:/mnt/knit:rw
    ports:
      - "8000:8000"   # Frappe web
      - "9000:9000"   # socketio
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

volumes:
  db-data:
  bench-home:
