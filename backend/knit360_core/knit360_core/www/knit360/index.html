<!DOCTYPE html>
<html lang="en" data-user="{{ user }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KNIT 360 — Customer to Cash</title>
<link rel="icon" href="/assets/knit360_core/images/knit360-logo.svg">
<script>window.frappe = window.frappe || {};</script>
<!-- csrf_token -->
<style>
:root {
  /* Structure is built from cool neutrals. Colour appears only where it
     carries meaning -- status, action, error -- which is the convention for
     data-dense enterprise screens; a saturated palette reads as a toy and
     stops any one colour meaning anything. Status is never signalled by
     colour alone: every coloured element also carries its word. */
  --brand: #2d4a6b;
  --brand-dark: #22384f;
  --brand-soft: #eef2f6;
  --brand-line: #c3d0dc;
  --ink: #1a1d21;
  --ink-soft: #454b53;
  --muted: #6c737c;
  --line: #dfe3e8;
  --line-soft: #eceef1;
  --bg: #f5f6f8;
  --panel: #fff;
  --ok: #2f6b4f;
  --ok-soft: #eef4f0;
  --ok-line: #c2d8cb;
  --warn: #8a6516;
  --warn-soft: #f8f4ea;
  --warn-line: #e2d3ac;
  --bad: #9c2b2b;
  --bad-soft: #f8efef;
  --bad-line: #e0c2c2;
  --r: 6px;
  /* Apple HIG and WCAG 2.2 AAA both put a comfortable touch target at 44px.
     WCAG 2.2 AA (2.5.8) sets the floor at 24px. Controls use 44 on coarse
     pointers and may be tighter on a mouse. */
  --tap: 44px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; }
table td, .count, .pill, .lock, .editor input { font-variant-numeric: tabular-nums; }
button { cursor: pointer; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0 0 10px; font-weight: 700; }

/* ---------- header ---------- */
header {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
}
header img { height: 30px; width: 30px; }
header .brand b { font-size: 16px; letter-spacing: -.01em; display: block; }
header .brand span { font-size: 12px; color: var(--muted); }
header .spacer { flex: 1; }
header a, header .who { color: var(--muted); font-size: 13px; text-decoration: none; }
header a:hover { color: var(--brand); }

/* ---------- journey ---------- */
.journey { background: var(--panel); border-bottom: 1px solid var(--line); padding: 14px 20px 16px; }
.journey .lead-in { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.steps { display: flex; align-items: stretch; gap: 0; flex-wrap: wrap; }
.step {
  flex: 1 1 200px; text-align: left; background: var(--panel);
  border: 2px solid var(--line); border-radius: var(--r); padding: 11px 14px; position: relative;
}
.step:hover { border-color: var(--brand-line); }
.step[aria-current="true"] { border-color: var(--brand); background: var(--brand-soft); }
.step .n {
  display: inline-flex; align-items: center; justify-content: center;
  width: 21px; height: 21px; border-radius: 50%; background: var(--line);
  color: var(--ink-soft); font-size: 11px; font-weight: 700; margin-right: 8px;
}
.step[aria-current="true"] .n { background: var(--brand); color: #fff; }
.step .name { font-weight: 650; font-size: 15px; }
.step .count { font-size: 12.5px; color: var(--muted); margin-top: 3px; margin-left: 29px; }
.arrow { display: flex; align-items: center; padding: 0 9px; color: #c3c8d0; font-size: 19px; }

/* ---------- layout ---------- */
.wrap { display: grid; grid-template-columns: minmax(300px, 420px) 1fr; gap: 1px; background: var(--line); }
.wrap > * { background: var(--bg); padding: 16px 18px; min-height: calc(100vh - 160px); }
.pane-detail { background: var(--panel); }

/* ---------- list ---------- */
.toolbar { display: flex; gap: 8px; margin-bottom: 10px; }
.toolbar input { flex: 1; padding: 8px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.toolbar input:focus { outline: 2px solid var(--brand-line); border-color: var(--brand); }

.filters { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; color: var(--ink-soft); }
.chip:hover { border-color: var(--brand-line); }
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }

.row {
  width: 100%; text-align: left; display: flex; align-items: center; gap: 10px;
  background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--line);
  border-radius: var(--r); padding: 11px 13px; margin-bottom: 7px;
}
.row:hover { border-color: var(--brand-line); border-left-color: var(--brand); }
.row[aria-current="true"] { border-color: var(--brand); border-left-color: var(--brand); background: var(--brand-soft); }
.row .main { flex: 1; min-width: 0; }
.row .title { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .chev { color: #b8bec8; font-size: 18px; }

.pill { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap;
        background: var(--brand-soft); color: var(--brand-dark); border: 1px solid var(--brand-line); }
.pill.done { background: var(--ok-soft); color: var(--ok); border-color: var(--ok-line); }
.pill.stop { background: #f3f4f6; color: var(--muted); border-color: var(--line); }

/* ---------- empty / callouts ---------- */
.empty { text-align: center; padding: 34px 18px; color: var(--muted); }
.empty .big { font-size: 15px; color: var(--ink-soft); font-weight: 600; margin-bottom: 4px; }
.callout { border: 1px solid var(--brand-line); background: var(--brand-soft); color: var(--brand-dark);
           border-radius: var(--r); padding: 11px 13px; font-size: 13.5px; margin-bottom: 14px; }
.callout.warn { border-color: var(--warn-line); background: var(--warn-soft); color: var(--warn); }
.callout.stop { border-color: var(--line); background: #f9fafb; color: var(--ink-soft); }
.callout b { display: block; margin-bottom: 2px; }

/* ---------- detail ---------- */
.detail-head { border-bottom: 1px solid var(--line); padding-bottom: 13px; margin-bottom: 15px; }
.detail-head .name { font-size: 20px; font-weight: 680; letter-spacing: -.01em; }
.detail-head .id { color: var(--muted); font-size: 12.5px; margin-top: 1px; }
.status-line { display: flex; align-items: center; gap: 9px; margin-top: 10px; flex-wrap: wrap; }
.lock { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: #f9fafb; }
.lock.locked { color: var(--warn); border-color: var(--warn-line); background: var(--warn-soft); }
.meaning { font-size: 13.5px; color: var(--ink-soft); margin-top: 9px; }

.btn { border: 1px solid var(--brand); background: var(--brand); color: #fff; border-radius: 8px; padding: 9px 16px; font-size: 14px; font-weight: 600; }
.btn:hover { background: var(--brand-dark); }
.btn.ghost { background: var(--panel); color: var(--brand); }
.btn.ghost:hover { background: var(--brand-soft); }
.btn.quiet { background: var(--panel); color: var(--ink-soft); border-color: var(--line); font-weight: 500; }
.btn.quiet:hover { border-color: var(--muted); }
.btn.small { padding: 5px 11px; font-size: 13px; }
.btn[disabled] { background: #f3f4f6; border-color: var(--line); color: #9ca3af; cursor: not-allowed; }

.act { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
details.more { margin-top: 11px; }
details.more summary { cursor: pointer; font-size: 13px; color: var(--muted); user-select: none; }
details.more summary:hover { color: var(--brand); }
details.more .act { margin-top: 9px; }
.hint { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }

/* Line symbols, drawn in the current text colour, never filled and never
   coloured on their own. They repeat the label rather than replace it. */
.ico { width: 16px; height: 16px; flex: 0 0 16px; stroke: currentColor; fill: none;
       stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ico-lg { width: 18px; height: 18px; flex-basis: 18px; }
.btn, .back { display: inline-flex; align-items: center; gap: 7px; }
.back { display: none; background: none; border: 0; color: var(--muted);
        padding: 4px 0 10px; font-size: 14px; }
.back:hover { color: var(--brand); }
.step .name, .row .title { display: flex; align-items: center; gap: 7px; }

section.block { margin-top: 22px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 650; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
td.k { color: var(--muted); width: 38%; }
tr:last-child td { border-bottom: none; }

/* ---------- forms ---------- */
form.new { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin-bottom: 14px; }
form.new .lede { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
form.new label { display: block; font-size: 12px; color: var(--ink-soft); font-weight: 600; margin: 9px 0 3px; }
form.new label .opt { color: var(--muted); font-weight: 400; }
form.new input, form.new select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
form.new input:focus, form.new select:focus { outline: 2px solid var(--brand-line); border-color: var(--brand); }
form.new .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.editor input { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; }
.editor input:focus { outline: 2px solid var(--brand-line); border-color: var(--brand); }

/* ---------- modal ---------- */
.scrim { position: fixed; inset: 0; background: rgba(15,20,30,.45); display: none; align-items: center; justify-content: center; z-index: 40; padding: 20px; }
.scrim.open { display: flex; }
.modal { background: var(--panel); border-radius: 14px; max-width: 460px; width: 100%; padding: 22px; box-shadow: 0 18px 50px rgba(0,0,0,.25); }
.modal h3 { margin: 0 0 8px; font-size: 17px; }
.modal p { margin: 0 0 8px; color: var(--ink-soft); font-size: 14px; }
.modal .act { margin-top: 18px; justify-content: flex-end; }

/* ---------- toast ---------- */
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
         max-width: 640px; padding: 12px 16px; border-radius: var(--r); font-size: 14px;
         box-shadow: 0 8px 26px rgba(0,0,0,.17); display: none; z-index: 50; }
#toast.err { background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad-line); }
#toast.ok  { background: var(--ok-soft); color: var(--ok); border: 1px solid var(--ok-line); }

/* ---------- mobile ---------- */
@media (pointer: coarse) {
  .btn, .chip, .row, .step { min-height: var(--tap); }
  .toolbar input, form.new input, form.new select { min-height: var(--tap); }
}

@media (max-width: 860px) {
  header { padding: 10px 14px; }
  .journey { padding: 10px 14px 12px; }
  .journey .lead-in { display: none; }
  /* One row that scrolls sideways beats three stacked cards that push the
     work below the fold. */
  .steps { flex-wrap: nowrap; overflow-x: auto; gap: 8px; scroll-snap-type: x mandatory;
           -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
  .steps::-webkit-scrollbar { height: 0; }
  .step { flex: 0 0 76%; scroll-snap-align: start; }
  .arrow { display: none; }

  .wrap { grid-template-columns: 1fr; }
  .wrap > * { min-height: 0; padding: 14px; }
  /* On a phone the two panes become two pages. data-view says which is open. */
  body[data-view="detail"] .pane-list { display: none; }
  body[data-view="list"] .pane-detail { display: none; }
  .back { display: inline-flex; }

  .detail-head .name { font-size: 18px; }
  .act { gap: 10px; }
  .act .btn { flex: 1 1 auto; justify-content: center; }
  table { font-size: 14px; }
  td.k { width: 44%; }
  form.new .pair { grid-template-columns: 1fr; }
}

@media (min-width: 861px) {
  .back { display: none !important; }
}
</style>
</head>
<body>

<header>
  <img src="/assets/knit360_core/images/knit360-logo.svg" alt="">
  <div class="brand">
    <b>KNIT 360</b>
    <span>Customer to Cash</span>
  </div>
  <div class="spacer"></div>
  <span class="who" id="who"></span>
  <a href="/app" title="Administration">Admin</a>
</header>

<div class="journey">
  <div class="lead-in">Work moves left to right. Pick a stage to see what is in it.</div>
  <div class="steps" id="steps"></div>
</div>

<div class="wrap">
  <div class="pane-list">
    <div id="new-area"></div>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search by name or number…" autocomplete="off">
    </div>
    <div class="filters" id="filters"></div>
    <div id="rows"></div>
  </div>
  <div class="pane-detail" id="detail"></div>
</div>

<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

{% raw %}
<script>
const API = "/api/method/knit360_core.api.c2c.";

/* Line symbols. Each is a conventional pictogram for the thing it marks -- a
   person for a prospect, a target for a deal being pursued, a document for a
   quotation, a padlock for a record that can no longer be edited. Drawn in the
   current text colour so they never become decoration. */
const ICONS = {
  lead:        "M16 19v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 17.5V19M10 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M17 7h4M19 5v4",
  opportunity: "M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8M12 13.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3",
  quotation:   "M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h4",
  lock:        "M17 11H7a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-7a1 1 0 0 0-1-1M8.5 11V7.5a3.5 3.5 0 1 1 7 0V11",
  unlock:      "M17 11H7a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-7a1 1 0 0 0-1-1M8.5 11V7.5a3.5 3.5 0 0 1 6.9-.9",
  next:        "M5 12h13M13 6l6 6-6 6",
  back:        "M19 12H6M11 18l-6-6 6-6",
  add:         "M12 5v14M5 12h14",
  search:      "M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14M21 21l-5-5",
  done:        "M4 12.5 9 17.5 20 6.5",
  stop:        "M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M9 9l6 6M15 9l-6 6",
  save:        "M5 5h11l3 3v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1M8 5v5h7V5M8 20v-5h8v5",
  remove:      "M6 7h12M10 11v6M14 11v6M8 7V5h8v2M7 7l1 13h8l1-13",
};

function icon(name, large) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("aria-hidden", "true");
  svg.setAttribute("class", "ico" + (large ? " ico-lg" : ""));
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", ICONS[name] || "");
  svg.append(path);
  return svg;
}

const STAGE_ICON = { lead: "lead", opportunity: "opportunity", quotation: "quotation" };

/* On a phone the list and the detail are two pages, not two columns. */
const isPhone = () => window.matchMedia("(max-width: 860px)").matches;
function setView(view) { document.body.dataset.view = view; }

const state = {
  stages: [], companies: [], stage: "lead", status: null,
  rows: [], query: "", selected: null, detail: null,
};

/* ================= transport ================= */

function serverMessage(body) {
  // Frappe returns thrown messages as a JSON-encoded list of JSON strings.
  try {
    const list = JSON.parse(body._server_messages || "[]");
    const texts = list.map(entry => {
      try { return JSON.parse(entry).message; } catch (e) { return entry; }
    });
    if (texts.length) return texts.join(" ").replace(/<[^>]+>/g, "");
  } catch (e) { /* fall through */ }
  if (body.exc_type === "ValidationError") return "That is not allowed here.";
  return "Something went wrong. Nothing was changed.";
}

async function call(method, args) {
  const res = await fetch(API + method, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-Frappe-CSRF-Token": window.frappe.csrf_token || "",
    },
    body: JSON.stringify(args || {}),
  });
  let body;
  try { body = await res.json(); } catch (e) { body = {}; }
  if (!res.ok) throw new Error(serverMessage(body));
  return body.message;
}

function toast(text, kind) {
  const el = document.getElementById("toast");
  el.textContent = text;
  el.className = kind;
  el.style.display = "block";
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = "none"; }, kind === "err" ? 9000 : 4000);
}

async function guard(fn) {
  try { await fn(); } catch (e) { toast(e.message, "err"); }
}

/* ================= helpers ================= */

const el = (tag, props, kids) => {
  const node = Object.assign(document.createElement(tag), props || {});
  (kids || []).forEach(k => node.append(k));
  return node;
};

const stageSpec = key => state.stages.find(s => s.key === key);

function pill(status, stage) {
  let cls = "pill";
  if (stage) {
    const last = stage.happy_path[stage.happy_path.length - 1];
    if (status === last) cls += " done";
    else if (stage.terminal.includes(status)) cls += " stop";
  }
  return el("span", { className: cls, textContent: status });
}

function confirmThen(title, body, confirmLabel, onYes) {
  const scrim = document.getElementById("scrim");
  const modal = document.getElementById("modal");
  const close = () => { scrim.classList.remove("open"); };

  const yes = el("button", { className: "btn", type: "button", textContent: confirmLabel });
  yes.onclick = () => { close(); onYes(); };
  const no = el("button", { className: "btn quiet", type: "button", textContent: "Cancel" });
  no.onclick = close;

  modal.replaceChildren(
    el("h3", { textContent: title }),
    ...body.map(text => el("p", { textContent: text })),
    el("div", { className: "act" }, [no, yes]),
  );
  scrim.classList.add("open");
  scrim.onclick = ev => { if (ev.target === scrim) close(); };
  yes.focus();
}

/* ================= journey ================= */

function renderSteps() {
  const host = document.getElementById("steps");
  host.replaceChildren();
  state.stages.forEach((stage, i) => {
    if (i) host.append(el("div", { className: "arrow", textContent: "→" }));
    const open = stage.total - stage.states
      .filter(s => stage.terminal.includes(s))
      .reduce((n, s) => n + (stage.counts[s] || 0), 0);
    const btn = el("button", { className: "step", type: "button" }, [
      el("div", null, [
        el("span", { className: "n", textContent: String(i + 1) }),
        el("span", { className: "name" }, [
          icon(STAGE_ICON[stage.key] || "quotation"),
          el("span", { textContent: stage.label }),
        ]),
      ]),
      el("div", {
        className: "count",
        textContent: stage.total
          ? `${stage.total} total · ${open} still open`
          : "nothing here yet",
      }),
    ]);
    btn.setAttribute("aria-current", String(stage.key === state.stage));
    btn.setAttribute("aria-label", `${stage.label}, ${stage.total} total`);
    btn.onclick = () => guard(() => select(stage.key, null));
    host.append(btn);
  });
}

/* ================= list ================= */

function renderFilters() {
  const stage = stageSpec(state.stage);
  const host = document.getElementById("filters");
  host.replaceChildren();
  if (!stage) return;
  const mk = (label, active, onClick) => {
    const chip = el("button", { className: "chip", type: "button", textContent: label });
    chip.setAttribute("aria-pressed", String(active));
    chip.onclick = onClick;
    return chip;
  };
  host.append(mk(`Everything (${stage.total})`, state.status === null, () => guard(() => select(state.stage, null))));
  stage.states.forEach(s => {
    const n = stage.counts[s] || 0;
    if (!n && state.status !== s) return;   // hide statuses nothing is in
    host.append(mk(`${s} (${n})`, state.status === s, () => guard(() => select(state.stage, s))));
  });
}

function visibleRows() {
  const q = state.query.trim().toLowerCase();
  if (!q) return state.rows;
  return state.rows.filter(r =>
    Object.values(r).some(v => v && String(v).toLowerCase().includes(q)));
}

function renderRows() {
  const stage = stageSpec(state.stage);
  const host = document.getElementById("rows");
  host.replaceChildren();
  const rows = visibleRows();

  if (!rows.length) {
    const first = state.stage === "lead";
    host.append(el("div", { className: "empty" }, [
      el("div", { className: "big", textContent: state.query
        ? "Nothing matches that search."
        : `No ${stage ? stage.label.toLowerCase() : "documents"} yet.` }),
      el("div", { textContent: state.query
        ? "Try a shorter search, or clear it."
        : first
          ? "Use the form above to add your first lead."
          : "These appear once you move something forward from the stage before." }),
    ]));
    return;
  }

  rows.forEach(row => {
    const sub = [row.name, row.customer, row.organization_name, row.lead_source]
      .filter(Boolean).join(" · ");
    const btn = el("button", { className: "row", type: "button" }, [
      el("div", { className: "main" }, [
        el("div", { className: "title", textContent: row.title }),
        el("div", { className: "sub", textContent: sub }),
      ]),
      pill(row.status, stage),
      el("span", { className: "chev", textContent: "›" }),
    ]);
    btn.setAttribute("aria-current", String(row.name === state.selected));
    btn.setAttribute("aria-label", `${row.title}, ${row.name}, ${row.status}`);
    btn.onclick = () => guard(() => openDoc(state.stage, row.name));
    host.append(btn);
  });
}

/* ================= detail ================= */

function table(rows, head) {
  const t = el("table");
  if (head) {
    const tr = el("tr");
    head.forEach(h => tr.append(el("th", { textContent: h })));
    t.append(el("thead", null, [tr]));
  }
  const body = el("tbody");
  rows.forEach(cells => {
    const tr = el("tr");
    cells.forEach((c, i) => tr.append(el("td", {
      textContent: c === null || c === undefined ? "" : String(c),
      className: (!head && i === 0) ? "k" : "",
    })));
    body.append(tr);
  });
  t.append(body);
  return t;
}

function moveTo(d, step) {
  const go = () => guard(async () => {
    const updated = await call("advance", { stage: d.stage, name: d.name, to_status: step.status });
    toast(`${d.name} is now "${updated.status}".`, "ok");
    state.detail = updated;
    await refresh();
    renderDetail();
  });
  if (step.warning) {
    confirmThen(
      `Move to "${step.status}"?`,
      [step.meaning, step.warning],
      `Yes, move to "${step.status}"`,
      go,
    );
  } else {
    go();
  }
}

function renderDetail() {
  const host = document.getElementById("detail");
  host.replaceChildren();
  const d = state.detail;
  const stage = d && stageSpec(d.stage);

  if (d) {
    const back = el("button", { className: "back", type: "button" }, [
      icon("back"), el("span", { textContent: "Back to the list" }),
    ]);
    back.onclick = () => { state.detail = null; state.selected = null; setView("list"); renderRows(); renderDetail(); };
    host.append(back);
  }

  if (!d) {
    host.append(el("div", { className: "empty" }, [
      el("div", { className: "big", textContent: "Nothing selected" }),
      el("div", { textContent: "Pick something from the list on the left to see it and move it along." }),
    ]));
    return;
  }

  /* --- heading --- */
  host.append(el("div", { className: "detail-head" }, [
    el("div", { className: "name", textContent: d.title }),
    el("div", { className: "id", textContent: d.name }),
    el("div", { className: "status-line" }, [
      pill(d.status, stage),
      el("span", { className: "lock" + (d.editable ? "" : " locked") }, [
        icon(d.editable ? "unlock" : "lock"),
        el("span", { textContent: d.editable ? "Editable" : "Locked — cannot be changed" }),
      ]),
    ]),
    el("div", { className: "meaning", textContent: d.meaning }),
  ]));

  /* --- what to do next --- */
  const forward = d.allowed_next.find(s => s.kind === "forward");
  const branches = d.allowed_next.filter(s => s.kind !== "forward");

  if (d.allowed_next.length) {
    host.append(el("div", { className: "callout" }, [
      el("b", { textContent: "What to do next" }),
      el("span", { textContent: d.guidance }),
    ]));
  } else {
    host.append(el("div", { className: "callout stop" }, [
      el("b", { textContent: "Finished" }),
      el("span", { textContent: d.guidance }),
    ]));
  }

  const primary = el("div", { className: "act" });
  if (forward) {
    const b = el("button", { className: "btn", type: "button" }, [
      icon("next"), el("span", { textContent: `Move to "${forward.status}"` }),
    ]);
    b.onclick = () => moveTo(d, forward);
    primary.append(b);
  }
  d.actions.filter(a => a.enabled).forEach(a => {
    const b = el("button", { className: "btn ghost", type: "button", textContent: a.label });
    b.title = a.hint || "";
    b.onclick = () => guard(async () => {
      if (a.key === "convert_lead") {
        const r = await call("convert_lead", { name: d.name });
        toast(`Created customer "${r.customer}" and opportunity ${r.opportunity}.`, "ok");
        await refresh();
        await select(a.goes_to, null);
        await openDoc(a.goes_to, r.opportunity);
      } else if (a.key === "create_quotation") {
        const q = await call("create_quotation", { opportunity: d.name });
        toast(`Created quotation ${q.name}.`, "ok");
        await refresh();
        await select(a.goes_to, null);
        await openDoc(a.goes_to, q.name);
      }
    });
    primary.append(b);
  });
  if (primary.childElementCount) host.append(primary);

  d.actions.filter(a => a.enabled && a.hint).forEach(a =>
    host.append(el("p", { className: "hint", textContent: a.hint })));
  d.actions.filter(a => !a.enabled && a.reason).forEach(a =>
    host.append(el("p", { className: "hint", textContent: `${a.label} — not available: ${a.reason}` })));

  if (branches.length) {
    const acts = el("div", { className: "act" });
    branches.forEach(step => {
      const b = el("button", { className: "btn quiet small", type: "button", textContent: step.status });
      b.title = step.meaning;
      b.onclick = () => moveTo(d, step);
      acts.append(b);
    });
    host.append(el("details", { className: "more" }, [
      el("summary", { textContent: forward ? "Other outcomes…" : "How does this end?" }),
      acts,
    ]));
  }

  /* --- details --- */
  if (d.fields.length) {
    host.append(el("section", { className: "block" }, [
      el("h2", { textContent: "Details" }),
      table(d.fields.map(f => [f.label, f.value])),
    ]));
  }

  /* --- items --- */
  if (d.items) {
    host.append(el("section", { className: "block" }, [
      el("h2", { textContent: d.items.label }),
      d.items.editable
        ? itemEditor(d)
        : d.items.rows.length
          ? table(d.items.rows.map(r => d.items.columns.map(c => r[c])), d.items.column_labels)
          : el("p", { className: "hint", textContent: "No lines, and they can no longer be added." }),
    ]));
  }

  /* --- history --- */
  host.append(el("section", { className: "block" }, [
    el("h2", { textContent: "What has happened so far" }),
    d.history.length
      ? table(
          d.history.map(h => [
            `${h.from_status || "created"} → ${h.to_status}`,
            (h.transitioned_at || "").slice(0, 16).replace("T", " "),
            h.transitioned_by,
          ]),
          ["Change", "When", "Who"])
      : el("p", { className: "hint", textContent: "Nothing yet — it has not been moved since it was created." }),
  ]));
}

function itemEditor(d) {
  const cols = d.items.columns;
  const draft = d.items.rows.map(r => Object.assign({}, r));
  const body = el("tbody");
  const wrap = el("div", { className: "editor" });

  function paint() {
    body.replaceChildren();
    draft.forEach((row, i) => {
      const tr = el("tr");
      cols.forEach(c => {
        const numeric = c === "qty" || c === "unit_rate" || c === "discount_percentage" || c === "rate";
        const input = el("input", {
          value: row[c] === null || row[c] === undefined ? "" : row[c],
          type: numeric ? "number" : "text", step: "any",
        });
        input.oninput = () => { row[c] = numeric ? (input.value === "" ? null : Number(input.value)) : input.value; };
        tr.append(el("td", null, [input]));
      });
      const del = el("button", { className: "btn quiet small", type: "button",
                                 title: "Remove this line", "aria-label": "Remove line " + (i + 1) },
                     [icon("remove")]);
      del.onclick = () => { draft.splice(i, 1); paint(); };
      tr.append(el("td", null, [del]));
      body.append(tr);
    });
    if (!draft.length) {
      body.append(el("tr", null, [el("td", {
        colSpan: cols.length + 1, className: "hint",
        textContent: "No lines yet. Add one below.",
      })]));
    }
  }

  const head = el("tr");
  cols.forEach((c, i) => head.append(el("th", { textContent: d.items.column_labels[i] })));
  head.append(el("th"));
  paint();

  const add = el("button", { className: "btn ghost small", type: "button" }, [icon("add"), el("span", { textContent: "Add a line" })]);
  add.onclick = () => { draft.push(Object.fromEntries(cols.map(c => [c, null]))); paint(); };

  const save = el("button", { className: "btn small", type: "button" }, [icon("save"), el("span", { textContent: "Save lines" })]);
  save.onclick = () => guard(async () => {
    const updated = await call("set_items", { stage: d.stage, name: d.name, items: JSON.stringify(draft) });
    toast(`Saved ${draft.length} line${draft.length === 1 ? "" : "s"}.`, "ok");
    state.detail = updated;
    renderDetail();
  });

  wrap.append(
    el("table", null, [el("thead", null, [head]), body]),
    el("div", { className: "act", style: "margin-top:10px" }, [add, save]),
    el("p", { className: "hint", textContent: "Changes are not kept until you press Save lines." }),
  );
  return wrap;
}

/* ================= new lead ================= */

function renderNewLead() {
  const host = document.getElementById("new-area");
  host.replaceChildren();
  if (state.stage !== "lead") return;

  if (!state.companies.length) {
    host.append(el("form", { className: "new" }, [
      el("p", { className: "hint", textContent:
        "No company is set up yet, so leads cannot be added. Create one in Admin first." }),
    ]));
    return;
  }

  const company = el("select", { name: "company", required: true });
  state.companies.forEach(c => company.append(el("option", { value: c.name, textContent: c.name })));

  const field = (label, name, opts) => el("div", null, [
    el("label", null, [
      el("span", { textContent: label }),
      opts && opts.optional ? el("span", { className: "opt", textContent: " (optional)" }) : el("span"),
    ]),
    el("input", Object.assign({ name: name }, opts && opts.attrs || {})),
  ]);

  const form = el("form", { className: "new" }, [
    el("div", { className: "lede", textContent: "Start here. A lead is someone who might buy from you." }),
    field("Who did you speak to?", "lead_name", { attrs: { required: true, placeholder: "Rakesh Patel" } }),
    el("div", { className: "pair" }, [
      field("Their company", "organization_name", { optional: true, attrs: { placeholder: "Shakti Forgings Pvt Ltd" } }),
      el("div", null, [el("label", null, [el("span", { textContent: "Your company" })]), company]),
    ]),
    el("div", { className: "pair" }, [
      field("Email", "email", { optional: true, attrs: { type: "email", placeholder: "name@company.com" } }),
      field("Phone", "phone", { optional: true, attrs: { placeholder: "+91 98250 11223" } }),
    ]),
    field("Where did they come from?", "lead_source", { optional: true, attrs: { placeholder: "Referral, website, trade show…" } }),
    el("div", { style: "margin-top:14px" }, [
      el("button", { className: "btn", type: "submit", textContent: "Add this lead" }),
    ]),
  ]);

  form.onsubmit = ev => {
    ev.preventDefault();
    const data = Object.fromEntries(new FormData(form).entries());
    guard(async () => {
      const created = await call("create_lead", data);
      toast(`Added ${created.name}. It is now on the board.`, "ok");
      form.reset();
      await refresh();
      await openDoc("lead", created.name);
    });
  };
  host.append(form);
}

/* ================= flow ================= */

async function refresh() {
  state.stages = await call("stages");
  state.rows = await call("documents", { stage: state.stage, status: state.status });
  renderSteps();
  renderFilters();
  renderRows();
}

async function select(stage, status) {
  setView("list");
  state.stage = stage;
  state.status = status;
  state.selected = null;
  state.detail = null;
  await refresh();
  renderNewLead();
  renderDetail();
}

async function openDoc(stage, name) {
  state.stage = stage;
  state.selected = name;
  state.detail = await call("document", { stage: stage, name: name });
  if (isPhone()) setView("detail");
  renderRows();
  renderDetail();
}

document.getElementById("search").oninput = ev => {
  state.query = ev.target.value;
  renderRows();
};
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") document.getElementById("scrim").classList.remove("open");
});

(async function start() {
  setView("list");
  document.getElementById("who").textContent = document.documentElement.dataset.user || "";
  await guard(async () => {
    state.companies = await call("companies");
    await select("lead", null);
  });
})();
</script>
